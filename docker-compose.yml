services:
  postgres:
    image: postgres:16-alpine
    container_name: pattern-analyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pattern_analyzer
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d pattern_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-java
    container_name: pattern-analyzer-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pattern_analyzer
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: pattern-analyzer-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
